spring.application.name=hotel-booking-system
server.port=8083

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hoteldb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# JWT Secret (HS256 requires 256 bits / 32 bytes minimum)
jwt.secret=9a67c4e5d2b1a8f3c7e6d5b4a3c2e1f08967452301fedcba9876543210abcdef
jwt.expiration=86400000
